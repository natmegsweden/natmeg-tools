[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "natmeg-tools"
version = "0.1.0"
description = "Optional dependency bundles for NATMEG research tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
opm = [
    "matplotlib>=3.8",
    "mne>=1.12",
    "numpy>=1.26",
    "scipy>=1.12",
]
opm-tools = [
    "matplotlib>=3.8",
    "mne>=1.12",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
]
opm-vtk = [
    "matplotlib>=3.8",
    "mne>=1.12",
    "numpy>=1.26",
    "pandas>=2.2",
    "PyQt5>=5.15",
    "scipy>=1.12",
    "vtk>=9.3",
]
lab-notebook = [
    "mne>=1.8",
    "streamlit>=1.55",
    "tzdata>=2024.1",
]
eeg = [
    "mne>=1.8",
    "numpy>=1.26",
    "scipy>=1.12",
]
tutorials = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "mne>=1.8",
    "numpy>=1.26",
    "scipy>=1.12",
]

[tool.setuptools]
packages = []
